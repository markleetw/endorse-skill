name: Release Endorse

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. v1.1.0)'
        required: true
        type: string
      evaluations_reviewed:
        description: 'Confirm fictional regression results were reviewed'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: endorse-release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ inputs.evaluations_reviewed }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version"; exit 1; }
          test "$GITHUB_REF_NAME" = "main" || { echo "Run releases from main"; exit 1; }
          test -s LICENSE
          test -s "releases/$VERSION.md"
          python scripts/validate.py
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Existing release; refusing overwrite"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Existing remote tag; refusing overwrite"; exit 1
          fi
          test -s "evals/gates/$VERSION.md" || {
            echo "Missing version-specific release gate"; exit 1;
          }
          grep -Fxq '**Release approval: APPROVED.**' "evals/gates/$VERSION.md" || {
            echo "This version has not been approved"; exit 1;
          }
      - name: Package with the same code used by CI
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/package.py --version "$VERSION" --output endorse.zip > SHA256SUMS
          unzip -t endorse.zip
          sha256sum --check SHA256SUMS
      - name: Publish release without overwriting tags
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$VERSION" endorse.zip SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Endorse $VERSION" \
            --notes-file "releases/$VERSION.md"
