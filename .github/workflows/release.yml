name: Release Endorse

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. v1.1.0)'
        required: true
        type: string
      evaluations_reviewed:
        description: 'Confirm that the fixed fictional regression suite was run and reviewed against the prior release'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: endorse-release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ inputs.evaluations_reviewed }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release prerequisites and structure
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version"; exit 1; }
          test -s LICENSE || { echo "Choose a license before claiming an open-source release"; exit 1; }
          python scripts/validate.py
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing tag $VERSION"
            exit 1
          fi
      - name: Package versioned skill
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p package/endorse
          cp SKILL.md README.md README.zh-TW.md RELEASE_NOTES.md LICENSE package/endorse/
          (cd package && zip -q -r "../endorse.zip" endorse)
          unzip -t endorse.zip
          sha256sum endorse.zip > SHA256SUMS
      - name: Publish immutable version tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite"
            exit 1
          fi
          gh release create "$VERSION" endorse.zip SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Endorse $VERSION" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag=false
