name: Publish Endorse v1.0.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1.0.0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release sources
        uses: actions/checkout@v4
      - name: Validate skill and documentation
        shell: bash
        run: |
          set -euo pipefail
          test -s SKILL.md
          test -s README.md
          test -s README.zh-TW.md
          test -s RELEASE_NOTES.md
          grep -q '^name: endorse$' SKILL.md
          grep -q '^description:' SKILL.md
          if grep -Eiq 'ChatGPT Project|ChatGPT 專案|project reference files|專案參考資料' README.md README.zh-TW.md RELEASE_NOTES.md; then
            echo 'Found non-skill installation guidance'
            exit 1
          fi
      - name: Package standard Agent Skill
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/endorse
          cp SKILL.md README.md README.zh-TW.md RELEASE_NOTES.md package/endorse/
          (cd package && zip -q -r ../endorse-v1.0.0.zip endorse)
          unzip -t endorse-v1.0.0.zip
      - name: Create tag and publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo 'v1.0.0 already exists; no release was overwritten'
            exit 0
          fi
          gh release create v1.0.0 endorse-v1.0.0.zip --target "$GITHUB_SHA" --title "Endorse v1.0.0" --notes-file RELEASE_NOTES.md
          gh release view v1.0.0 --json url,tagName,assets
