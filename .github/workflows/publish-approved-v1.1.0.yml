name: Publish approved Endorse v1.1.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-approved-v1.1.0.yml

permissions:
  contents: read

concurrency:
  group: endorse-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4
      - name: Validate approved release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s LICENSE
          test -s releases/v1.1.0.md
          grep -Fxq '**Release approval: APPROVED.**' evals/release-gate.md
          python3 scripts/validate.py
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo 'Release already exists. Refusing to overwrite.'
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v1.1.0 >/dev/null 2>&1; then
            echo 'Tag already exists. Refusing to overwrite.'
            exit 1
          fi
      - name: Package and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package.py --version v1.1.0 --output endorse.zip > SHA256SUMS
          unzip -t endorse.zip
          sha256sum --check SHA256SUMS
      - name: Publish Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.1.0 endorse.zip SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Endorse v1.1.0" \
            --notes-file releases/v1.1.0.md
          gh release view v1.1.0 --json url,tagName,assets
